[package]
name = "ipod-player"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A classic iPod-style desktop controller for Music Player Daemon"
repository = "https://github.com/haikeyidesu/ipod-player"

[package.metadata.macos]
name = "iPod Player"
identifier = "io.github.haikeyidesu.ipod-player"
minimum-system-version = "12.0"
icon = "assets/icon/AppIcon.icns"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rand = "0.9"
slint = { version = "1.18.1", features = ["raw-window-handle-06"] }

[target.'cfg(target_os = "macos")'.dependencies]
mediaplayer = "0.5.0"
raw-window-handle = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSView", "NSWindow", "NSScreen", "NSEvent", "NSCursor", "block2"] }
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["objc2-core-foundation"] }

[build-dependencies]
slint-build = "1.18.1"
