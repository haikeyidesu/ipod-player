[package]
name = "ipod-player"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A classic iPod-style desktop controller for Music Player Daemon"
repository = "https://github.com/haikeyidesu/ipod-player"

[package.metadata.macos]
name = "iPod Player"
identifier = "io.github.haikeyidesu.ipod-player"
minimum-system-version = "12.0"
icon = "assets/icon/AppIcon.icon"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
httpdate = "1"
slint = { version = "1.18.1", features = ["raw-window-handle-06"] }

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSView", "NSWindow", "NSApplication", "NSScreen", "NSEvent", "NSCursor", "NSTrackingArea", "NSBox", "NSColor", "block2"] }
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["objc2-core-foundation"] }

[build-dependencies]
slint-build = "1.18.1"

[[example]]
name = "now_playing_preview"
test = true
